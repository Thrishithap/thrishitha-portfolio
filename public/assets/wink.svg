<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Face Gradient -->
    <linearGradient id="winkFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <!-- Cheek Blush Gradient -->
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5C9A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF5C9A" stop-opacity="0"/>
    </radialGradient>
    <!-- Star Sparkle Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
    <filter id="winkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#winkFaceGrad)" filter="url(#winkGlow)" opacity="0.35"/>

  <!-- Main Face Body -->
  <circle cx="50" cy="50" r="44" fill="url(#winkFaceGrad)" stroke="#FFA000" stroke-width="2"/>

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="23" cy="58" rx="9" ry="5.5" fill="url(#cheekBlush)"/>
  <ellipse cx="77" cy="58" rx="9" ry="5.5" fill="url(#cheekBlush)"/>

  <!-- Left Eye: Cute Winking Arc with Eyelashes -->
  <path d="M22 47 Q32 37 42 47" fill="none" stroke="#3E2723" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Cute Eyelash flicks on winking eye -->
  <path d="M41 45 L46 41" fill="none" stroke="#3E2723" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32 39 L33 34" fill="none" stroke="#3E2723" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right Eye: Big Joyful Anime Open Eye with Sparkle -->
  <ellipse cx="68" cy="46" rx="8" ry="11" fill="#3E2723"/>
  <!-- Primary Eye Highlight -->
  <circle cx="65.5" cy="42" r="4" fill="#FFFFFF"/>
  <!-- Secondary Catchlight -->
  <circle cx="71" cy="50" r="2" fill="#FFFFFF"/>

  <!-- Cute Eyebrows -->
  <path d="M24 33 Q32 28 40 33" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 33 Q68 28 76 33" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>

  <!-- Happy Smiling Mouth with Tongue -->
  <path d="M36 58 Q50 78 64 58 Z" fill="#D81B60"/>
  <path d="M42 66 Q50 78 58 66 Z" fill="#FF80AB"/>
  <path d="M34 58 Q50 63 66 58" fill="none" stroke="#3E2723" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Floating Star Sparkle beside wink -->
  <path d="M12 24 L14.5 29.5 L20 32 L14.5 34.5 L12 40 L9.5 34.5 L4 32 L9.5 29.5 Z" fill="url(#starGrad)"/>
  <circle cx="12" cy="32" r="1.5" fill="#FFFFFF"/>

  <!-- Mini Sparkle at top right -->
  <path d="M84 18 L85.5 22 L89.5 23.5 L85.5 25 L84 29 L82.5 25 L78.5 23.5 L82.5 22 Z" fill="#FFE082"/>
</svg>
